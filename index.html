<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DYSZN is getting ready. Something fresh is coming.">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <title>DYSZN | Something fresh is coming</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --ink: #17251f;
            --paper: #eeece2;
            --coral: #e8795f;
            --chartreuse: #d9e56d;
            --line: rgba(23, 37, 31, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: "Space Grotesk", sans-serif;
        }

        .mono {
            font-family: "DM Mono", monospace;
        }

        .page-shell {
            background:
                linear-gradient(135deg, rgba(232, 121, 95, 0.12), transparent 38%),
                linear-gradient(315deg, rgba(217, 229, 109, 0.2), transparent 36%),
                var(--paper);
        }

        .wordmark {
            letter-spacing: -0.085em;
        }

        .hero-title {
            font-size: clamp(4rem, 13vw, 11rem);
            line-height: 0.82;
        }

        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--ink);
        }

        .rule {
            border-color: var(--line);
        }

        .social-link {
            transition: transform 180ms ease, background-color 180ms ease;
        }

        .social-link:hover {
            transform: translateY(-4px) rotate(-2deg);
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal {
            animation: reveal 700ms ease-out both;
        }

        .reveal-delay {
            animation-delay: 140ms;
        }

        .reveal-delay-more {
            animation-delay: 260ms;
        }
    </style>
</head>

<body class="min-h-screen">
    <main class="page-shell min-h-screen overflow-hidden px-6 py-6 sm:px-10 sm:py-8 lg:px-16">
        <nav class="flex items-center justify-between border-b rule pb-5" aria-label="Main navigation">
            <a href="index.html" class="wordmark text-2xl font-bold tracking-tight" aria-label="DYSZN home">DYSZN<span
                    class="text-[#e8795f]">.</span></a>
            <span class="mono text-[10px] uppercase tracking-[0.22em] opacity-70 sm:text-xs">Est. 2026 / Online
                soon</span>
        </nav>

        <section
            class="grid min-h-[calc(100vh-154px)] items-center gap-12 py-16 lg:grid-cols-[1.1fr_0.9fr] lg:gap-20 lg:py-20">
            <div>
                <p class="mono reveal mb-8 text-[10px] uppercase tracking-[0.28em] opacity-70 sm:text-xs">01 — The wait
                    is part of it</p>
                <h1 class="wordmark hero-title reveal reveal-delay max-w-5xl font-bold uppercase">
                    Something<br>
                    <span class="outline-text">fresh</span> is<br> coming<span class="text-[#e8795f]">.</span>
                </h1>
                <div
                    class="reveal reveal-delay-more mt-12 flex max-w-md items-start gap-4 border-l-2 border-[#e8795f] pl-5 sm:mt-16">
                    <span class="mt-1 h-2 w-2 shrink-0 rounded-full bg-[#d9e56d] ring-2 ring-[#17251f]"></span>
                    <p class="text-base leading-relaxed opacity-80 sm:text-lg">We’re currently working on our website.
                        Stay tuned for the first drop.</p>
                </div>
            </div>

            <div class="reveal reveal-delay-more relative mx-auto w-full max-w-sm lg:justify-self-end">
                <div
                    class="relative aspect-[4/5] rotate-2 overflow-hidden bg-[#e8795f] p-5 shadow-[14px_14px_0_#17251f] sm:p-7">
                    <div class="flex h-full flex-col justify-between border border-[#17251f]/45 p-5 sm:p-7">
                        <div class="flex items-start justify-between">
                            <span class="mono text-xs">DYSZN / 001</span>
                            <span class="text-2xl">↗</span>
                        </div>
                        <div>
                            <p class="mono mb-3 text-[10px] uppercase tracking-[0.24em]">New season loading</p>
                            <p class="wordmark text-7xl font-bold uppercase leading-[0.78] sm:text-8xl">
                                Wear<br>your<br><span class="text-[#d9e56d]">why.</span></p>
                        </div>
                        <div class="flex items-end justify-between border-t border-[#17251f]/45 pt-4">
                            <span class="mono text-[10px] uppercase tracking-[0.18em]">DYSZN</span>
                            <span class="mono text-[10px] uppercase tracking-[0.18em]">Soon</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="flex flex-col gap-5 border-t rule pt-5 text-sm sm:flex-row sm:items-center sm:justify-between">
            <p class="mono text-[10px] uppercase tracking-[0.2em] opacity-65">Follow the signal</p>
            <div class="flex items-center gap-3">
                <a class="social-link flex h-11 w-11 items-center justify-center rounded-full bg-[#d9e56d] text-[#17251f]"
                    target="_blank" href="https://www.tiktok.com/@dysznstudio" aria-label="DYSZN on TikTok" title="TikTok">
                    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 fill-current">
                        <path
                            d="M16.7 3c.3 1.8 1.3 3.1 3.3 3.5v3.1a8.3 8.3 0 0 1-3.3-1v6.2a6 6 0 1 1-5.2-5.9v3.2a2.8 2.8 0 1 0 2 2.7V3h3.2Z" />
                    </svg>
                </a>
            </div>
        </footer>
    </main>
</body>

</html>
